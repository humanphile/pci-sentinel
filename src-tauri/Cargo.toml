[package]
name = "pci-sentinel"
version = "1.0.0"
description = "PCI DSS v4.0.1 Air-Gapped Sentinel"
authors = ["Ahmad Adnan"]
edition = "2021"

[lib]
name = "pci_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
dirs = "5"
tokio = { version = "1", features = ["full"] }
zip = "0.6"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# Cryptographic Enclave
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
directories = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple Vision OCR so the local LLM can genuinely evaluate image evidence
# (text is extracted locally and fed to the text-only Qwen model).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNDefines", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation"] }
