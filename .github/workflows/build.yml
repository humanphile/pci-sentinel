name: Build PCI-Sentinel Windows & macOS

on:
  push:
    branches: [ main, master, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        run: npm run build

      - name: Setup Rust (MSVC / Apple)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Download llama-server sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "$RUNNER_OS" == "macOS" ]; then
            curl -L -o /tmp/llama-mac.tar.gz https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-bin-macos-arm64.tar.gz || true
            tar -xzf /tmp/llama-mac.tar.gz -C src-tauri/bin/ 2>/dev/null || true
            mv src-tauri/bin/llama-server src-tauri/bin/llama-server-aarch64-apple-darwin 2>/dev/null || touch src-tauri/bin/llama-server-aarch64-apple-darwin
            chmod +x src-tauri/bin/llama-server*
          elif [ "$RUNNER_OS" == "Windows" ]; then
            curl -L -o /tmp/llama-win.zip https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-bin-win-avx2-x64.zip || true
            unzip -o /tmp/llama-win.zip -d src-tauri/bin/ 2>/dev/null || true
            mv src-tauri/bin/llama-server.exe src-tauri/bin/llama-server-x86_64-pc-windows-msvc.exe 2>/dev/null || touch src-tauri/bin/llama-server-x86_64-pc-windows-msvc.exe
          fi

      - name: Build Tauri App
        run: npm run tauri build -- --verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pci-sentinel-artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
