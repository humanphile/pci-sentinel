name: Build PCI-Sentinel Windows & macOS

on:
  push:
    branches: [ main, master, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        run: npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Create sidecar binary stub
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "$RUNNER_OS" == "macOS" ]; then
            FILE_PATH="src-tauri/bin/llama-server-aarch64-apple-darwin"
          else
            FILE_PATH="src-tauri/bin/llama-server-x86_64-pc-windows-msvc.exe"
          fi
          echo '#!/bin/sh' > "$FILE_PATH"
          echo 'exit 0' >> "$FILE_PATH"
          chmod +x "$FILE_PATH"
          ls -la src-tauri/bin/

      - name: Build Tauri App
        run: npm run tauri build -- --verbose

      - name: Collect installers universally
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/release -maxdepth 4 \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.app" \) -exec cp -R {} artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pci-sentinel-artifacts-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: warn
