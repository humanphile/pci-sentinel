name: Build PCI-Sentinel Windows & macOS

on:
  push:
    branches: [ main, master, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        run: npm run build

      - name: Setup Rust (MSVC / Apple)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Prepare sidecar binary stub
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "$RUNNER_OS" == "macOS" ]; then
            TARGET_FILE="src-tauri/bin/llama-server-aarch64-apple-darwin"
          else
            TARGET_FILE="src-tauri/bin/llama-server-x86_64-pc-windows-msvc.exe"
          fi
          touch "$TARGET_FILE"
          chmod +x "$TARGET_FILE"
          echo '#!/bin/sh' > "$TARGET_FILE"
          echo 'exit 0' >> "$TARGET_FILE"

      - name: Build Tauri App
        run: npm run tauri build -- --verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pci-sentinel-artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
